name: Weekly refresh

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lists-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh from Wikidata and DNS
        run: python -u scripts/refresh.py --dns-rate 300

      - name: Build lists
        run: python -u scripts/build.py

      - name: Test lists
        run: python -u scripts/test_lists.py

      - name: Commit updated lists
        run: |
          git add lists data/generated README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly refresh from Wikidata"
          git push
